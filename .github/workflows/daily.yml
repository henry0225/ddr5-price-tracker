name: Daily price scrape

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC daily (~6-9am US). Adjust as you like.
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # so the job can commit updated JSON back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        run: python scraper/run.py

      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/prices.json docs/history.json
          git diff --cached --quiet || git commit -m "prices: $(date -u +%F)"
          git push
