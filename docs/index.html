<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>32GB DDR5 Price Tracker</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #151a23; --line: #232a36;
    --fg: #e6e9ef; --muted: #8b94a7; --accent: #4ade80; --accent2: #60a5fa;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --line:#e4e7ec; --fg:#111827; --muted:#6b7280; --accent:#16a34a; --accent2:#2563eb; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px; max-width:820px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .hero { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:28px; text-align:center; margin-bottom:16px; }
  .hero .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.5px; }
  .hero .price { font-size:56px; font-weight:700; color:var(--accent); margin:6px 0; }
  .hero .note { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  @media (max-width:560px){ .grid { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:0 0 12px; }
  .stat { display:flex; justify-content:space-between; padding:5px 0; font-size:14px; }
  .stat b { font-variant-numeric:tabular-nums; }
  .down { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:7px 0; border-top:1px solid var(--line); vertical-align:top; }
  td.p { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; padding-left:12px; }
  svg { width:100%; height:120px; display:block; }
  .foot { color:var(--muted); font-size:12px; text-align:center; margin-top:24px; }
  a { color:var(--accent2); }
</style>
</head>
<body>
  <h1>32GB DDR5 RAM — Live Price</h1>
  <div class="sub" id="updated">Loading…</div>

  <div class="hero">
    <div class="label">Cheapest right now</div>
    <div class="price" id="best">—</div>
    <div class="note" id="best-note"></div>
  </div>

  <div class="grid" id="sources"></div>

  <div class="card">
    <h2>Cheapest-price history</h2>
    <svg id="chart" viewBox="0 0 600 120" preserveAspectRatio="none"></svg>
    <div class="down" id="chart-note"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>Cheapest kits (Newegg)</h2>
    <table id="kits"></table>
  </div>

  <div class="foot">Prices are 32GB (2×16GB) DDR5 kits · updated daily · <a href="prices.json">raw JSON</a></div>

<script>
const money = n => n == null ? "—" : "$" + n.toFixed(2);

async function load() {
  const data = await fetch("prices.json?_=" + Date.now()).then(r => r.json());
  const hist = await fetch("history.json?_=" + Date.now()).then(r => r.json()).catch(() => []);

  const d = new Date(data.updated);
  document.getElementById("updated").textContent =
    "Last updated " + d.toLocaleString() + " · " + data.unit;

  document.getElementById("best").textContent = money(data.best_price);
  const cheapSrc = Object.entries(data.sources).find(([, s]) => s.cheapest === data.best_price);
  document.getElementById("best-note").textContent =
    cheapSrc ? "lowest across tracked retailers · " + cheapSrc[0] : "no data available today";

  const sc = document.getElementById("sources");
  for (const [name, s] of Object.entries(data.sources)) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<h2>${name}</h2>` + (s.count
      ? `<div class="stat"><span>Cheapest</span><b>${money(s.cheapest)}</b></div>
         <div class="stat"><span>Median</span><b>${money(s.median)}</b></div>
         <div class="stat"><span>Kits tracked</span><b>${s.count}</b></div>`
      : `<div class="down">No data today (blocked or unavailable)</div>`);
    sc.appendChild(el);
  }

  const kits = (data.sources.newegg && data.sources.newegg.kits) || [];
  document.getElementById("kits").innerHTML = kits.map(k =>
    `<tr><td>${k.title}</td><td class="p">${money(k.price)}</td></tr>`).join("");

  drawChart(hist.filter(h => h.source === "newegg"));
}

function drawChart(pts) {
  const svg = document.getElementById("chart");
  const note = document.getElementById("chart-note");
  if (pts.length < 2) { note.textContent = "Chart appears after a few days of data."; return; }
  const W = 600, H = 120, pad = 8;
  const ys = pts.map(p => p.cheapest);
  const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
  const y = v => H - pad - (v - lo) / span * (H - 2 * pad);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.cheapest).toFixed(1)}`).join(" ");
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim();
  svg.innerHTML =
    `<path d="${line} L${x(pts.length-1)},${H} L${x(0)},${H} Z" fill="${accent}" opacity="0.12"/>` +
    `<path d="${line}" fill="none" stroke="${accent}" stroke-width="2"/>`;
  note.textContent = `${pts.length} days · low ${money(lo)} · high ${money(hi)}`;
}

load().catch(e => document.getElementById("updated").textContent = "Failed to load data: " + e);
</script>
</body>
</html>
